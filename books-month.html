<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이달의 책 | 부런치 북클럽</title>
<style>
  :root{
    --bg:#F4EDE1;--card:#FFFDF7;--text:#3B2E24;--text-mid:#7C6A57;--text-mute:#A99883;
    --wine:#BE7C71;--wine-dark:#A0605A;--wine-light:#DCB2A9;--wine-pale:#F1E3D9;
    --border:#E9DDC8;--shadow:0 6px 22px rgba(120,88,62,.10);--r:22px;--r-sm:13px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:url("images/background.jpg") center center/cover no-repeat;background-attachment:fixed;
    color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px 40px;}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(248,241,228,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:14px 0 10px;}
  .back{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--wine-dark);font-size:1.1rem;flex-shrink:0;}
  .topbar b{font-size:1.05rem;font-weight:900;color:var(--wine-dark);}
  .book-hero{background:linear-gradient(160deg,#FBF4E7,#F0E6D6);border:1.5px solid var(--border);border-radius:var(--r);
    padding:26px 22px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px;}
  .b-review{display:inline-block;margin-top:16px;font-size:.85rem;font-weight:800;color:var(--wine-dark);
    background:#fff;border:1.5px solid var(--wine-light);border-radius:12px;padding:10px 18px;text-decoration:none;}
  .b-review:active{transform:scale(.98);}
  .b-cover{width:130px;height:186px;border-radius:12px;margin:0 auto 16px;background:linear-gradient(135deg,var(--wine-light),var(--wine));
    display:flex;align-items:center;justify-content:center;font-size:3rem;box-shadow:0 10px 30px rgba(154,96,112,.35);overflow:hidden;}
  .b-cover img{width:100%;height:100%;object-fit:cover;}
  .b-month{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.12em;color:var(--wine);
    background:var(--wine-pale);padding:4px 14px;border-radius:100px;margin-bottom:12px;}
  .b-en{font-family:Georgia,"Times New Roman",serif;font-size:1.4rem;font-weight:700;line-height:1.3;letter-spacing:-.01em;color:var(--wine-dark);}
  .b-ko{font-size:.95rem;color:var(--text-mid);margin-top:5px;}
  .b-meta{font-size:.8rem;color:var(--wine);font-weight:700;margin-top:12px;}
  .card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card h2{font-size:1rem;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
  .card p{font-size:.9rem;color:var(--text-mid);line-height:1.75;word-break:keep-all;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:.78rem;font-weight:700;color:var(--wine-dark);background:var(--wine-pale);padding:6px 13px;border-radius:100px;}
  .rec-list{list-style:none;display:flex;flex-direction:column;gap:9px;}
  .rec-list li{font-size:.9rem;color:var(--text);line-height:1.55;padding-left:24px;position:relative;word-break:keep-all;}
  .rec-list li::before{content:'✔️';position:absolute;left:0;top:0;font-size:.82rem;}
  .plan-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .plan-row:last-child{border-bottom:none;}
  .plan-w{font-size:.82rem;font-weight:800;color:var(--wine);width:52px;flex-shrink:0;}
  .plan-d{font-size:.88rem;color:var(--text);line-height:1.5;}
  .plan-d b{color:var(--wine-dark);}
  .q-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
  .q-list li{font-size:.9rem;color:var(--text);line-height:1.6;padding-left:22px;position:relative;word-break:keep-all;}
  .q-list li::before{content:'💬';position:absolute;left:0;top:0;font-size:.9rem;}
  .q-list li b{color:var(--wine-dark);}
  .cta{display:block;width:100%;padding:16px;border-radius:var(--r);font-size:1rem;font-weight:800;
    background:linear-gradient(135deg,#CC8A80,#AC6960);color:#fff;text-align:center;text-decoration:none;
    box-shadow:0 6px 18px rgba(150,92,70,.30);margin-top:6px;}
</style>
</head>

 "01":{en:"Secrets of the Millionaire Mind",author:"T. Harv Eker",cover:"images/book-01.png",

  chips:["#돈마인드","#부의청사진","#사고방식","#자기점검"],

  plan:[["나의 돈 청사진 발견","어린 시절 돈에 대해 들은 말·경험이 지금 나를 어떻게 움직이는지 돌아보기"],["부의 사고방식 (상)","부자와 가난한 사람의 생각 차이를 내 삶과 하나씩 대조"],["부의 사고방식 (하)","실천 습관으로 옮겨보기"],["나의 새 청사진 쓰기","앞으로 돈을 대할 새로운 선언과 행동 정리 · 완독!"]],

 "02":{en:"Show Your Work!",author:"Austin Kleon",cover:"images/book-02.png",
  why:"좋은 작업을 하는 것만큼, 그 과정을 세상과 나누는 것이 중요하다고 말하는 책이에요. 나를 알리고 연결되는 법을 부담 없이 배우는 한 달로 좋아요.",

  plan:[["왜 과정을 나누나","아마추어처럼 배우며 공유하기"],["매일 조금씩","나눌 만한 것을 찾고 기록하는 습관"],["이야기와 가르치기","내 이야기를 들려주고 아는 것을 나누기"],["나만의 공유 루틴","앞으로 꾸준히 실천할 방법 정리 · 완독!"]],
  talks:["나는 왜 ‘보여주기’가 어려운가? 두려움의 정체 들여다보기","지금 내가 나눌 수 있는 ‘과정’은 무엇인가?","한 달간 실천할 나만의 공유 방법 하나는?"]},

  why:"바쁘고 소란한 일상에서 평온과 목적을 되찾는 법을, 수도자의 지혜로 풀어낸 책이에요. 마음을 정돈하며 읽기 좋은 한 달.",

  chips:["#마음챙김","#목적","#평온","#자기성찰"],
  rec:["늘 바쁘지만 공허한 분","남의 시선·비교에 지친 분","삶의 목적을 찾고 싶은 분","감정을 다스리고 싶은 분","명상·자기성찰에 관심 있는 분"],
  plan:[["놓아주기","나를 옭아매는 두려움·비교·정체성 알아차리기"],["나를 알기","진짜 나의 가치와 목적 발견"],["마음 다스리기","에고·부정적 생각 다루기"],["베풀기","감사와 봉사로 확장 · 완독!"]],

 "04":{en:"Made to Stick",author:"Chip & Dan Heath",cover:"images/book-04.png",

  chips:["#메시지","#전달력","#스토리","#설득"],
  rec:["발표·기획·글쓰기를 잘하고 싶은 분","내 말이 잘 안 기억되는 게 고민인 분","교육·마케팅·콘텐츠를 하는 분","아이디어를 설득력 있게 전하고 싶은 분"],
  plan:[["단순함 & 의외성","핵심을 남기고 예상을 깨기"],["구체성 & 신뢰성","손에 잡히게, 믿게 만들기"],["감정 & 스토리","마음을 움직이고 이야기로 담기"],["내 메시지에 적용","내가 전할 것 하나를 6원칙으로 다듬기 · 완독!"]],
  talks:["내 기억에 ‘착 붙은’ 메시지 하나와 그 이유는?","내가 전하고 싶은데 잘 안 붙는 메시지는? 어떤 원칙이 부족했나?","오늘 배운 원칙으로 다시 만든 한 문장 나누기"]},
 "05":{en:"Keep Going",author:"Austin Kleon",cover:"images/book-05.png",
  why:"열정이 식고 지칠 때에도 창작과 일상을 ‘계속’해 나가는 법을 다정하게 알려주는 책이에요. 꾸준함의 힘을 채우는 한 달.",

  chips:["#꾸준함","#번아웃극복","#루틴","#과정"],
  rec:["자꾸 작심삼일이 되는 분","번아웃·매너리즘에 빠진 분","결과에 조급해지는 분","나만의 루틴을 지키고 싶은 분","공부·창작을 오래 이어가고 싶은 분"],
  plan:[["매일을 지키기","하루 단위로 살아가는 힘"],["소음에서 벗어나기","비교·불안에서 나를 보호"],["과정에 집중","결과가 아닌 ‘하는 것’ 자체 즐기기"],["나만의 지속 루틴","앞으로 계속할 방식 정리 · 완독!"]],
  talks:["나는 언제 ‘계속하기’가 가장 어려운가?","나를 지치게 하는 소음(비교·불안)은 무엇인가?","결과를 빼고, 과정 자체로 즐거운 일은?"]},
 "06":{en:"The Subtle Art of Not Giving a F*ck",author:"Mark Manson",cover:"images/book-06.png",

  chips:["#우선순위","#가치","#책임","#자기수용"],

  plan:[["관심은 유한하다","무엇에 신경 쓰고 무엇을 놓을지"],["가치의 재정비","내 기준(가치)을 다시 세우기"],["책임과 선택","탓하기 대신 내가 통제할 것에 집중"],["나의 우선순위 정리","덜어낼 것과 지킬 것 · 완독!"]],
  talks:["나는 지금 ‘신경 쓰지 않아도 될 것’에 얼마나 에너지를 쓰나?","내가 진짜 신경 써야 할 가치 3가지는?","이번 달에 하나 ‘내려놓기’로 정한다면?"]},
 "07":{en:"Man's Search for Meaning",author:"Viktor E. Frankl",cover:"images/book-07.png",
  why:"인간이 가장 극한의 고통 속에서도 어떻게 의미를 찾는지를 보여주는 고전이에요. 삶의 의미를 깊이 생각해보는 한 달.",

  rec:["힘든 시기를 지나고 있는 분","삶의 의미를 고민하는 분","마음의 힘을 기르고 싶은 분","인생 고전을 읽고 싶은 분","심리·철학에 관심 있는 분"],

  talks:["지금 내 삶을 버티게 하는 ‘의미’는 무엇인가?","바꿀 수 없는 상황에서 내가 선택할 수 있는 ‘태도’는?","이 책에서 가장 오래 남는 한 문장과 그 이유는?"]},

function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function getParam(){ const m=(location.search.match(/[?&]book=([0-9]{1,2})/)||[])[1]; if(m){ return m.padStart(2,'0'); } const cur=String(new Date().getMonth()+1).padStart(2,'0'); return BOOKS[cur]?cur:'08'; }

function render(){
  const key=getParam(); const b=BOOKS[key]||BOOKS['08'];
  const mi=parseInt(key,10)-1;
  const last=new Date(2026, mi+1, 0).getDate();
  const period='2026.'+String(mi+1).padStart(2,'0')+'.01 ~ '+String(last).padStart(2,'0');
  const coverHtml = b.cover ? '<img src="'+b.cover+'" alt="'+esc(b.en)+'">' : '📚';
  const html =
    '<div class="book-hero">'
    +'<div class="b-month">'+(mi+1)+'월의 책 · '+MONTH_EN[mi]+'</div>'
    +'<div class="b-cover">'+coverHtml+'</div>'
    +'<div class="b-en">'+esc(b.en)+'</div>'
    +'<div class="b-ko">'+esc(b.author)+'</div>'
    +'<div class="b-meta">📅 '+period+'</div>'
    +(b.review ? '<a class="b-review" href="'+b.review+'" target="_blank" rel="noopener">📖 지정책 서평 보기</a>' : '')
    +'</div>'
    +'<div class="card"><h2>✨ 이 책을 고른 이유</h2><p>'+b.why+'</p></div>'
    +'<div class="card"><h2>📖 책 내용 간단 소개</h2><p>'+b.synopsis+'</p></div>'
    +'<div class="card"><h2>🎯 이런 분께 추천해요</h2>'
      +'<div class="chips" style="margin-bottom:14px;">'+b.chips.map(c=>'<span class="chip">'+esc(c)+'</span>').join('')+'</div>'
      +'<ul class="rec-list">'+b.rec.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul></div>'
    +'<div class="card"><h2>🗓️ 이달의 읽기 계획</h2>'
      +b.plan.map((p,i)=>'<div class="plan-row"><div class="plan-w">'+(i+1)+'주차</div><div class="plan-d"><b>'+esc(p[0])+'</b><br>'+esc(p[1])+'</div></div>').join('')+'</div>'
    +'<div class="card"><h2>💬 북토크 주제</h2><ul class="q-list">'
      +b.talks.map(t=>{ const idx=t.indexOf('—'); if(idx>-1){ return '<li><b>'+esc(t.slice(0,idx).trim())+'</b><br>'+esc(t.slice(idx+1).trim())+'</li>'; } return '<li><b>'+esc(t)+'</b></li>'; }).join('')
      +'</ul></div>';
  document.getElementById('content').innerHTML=html;
  document.title = b.en+' | 부런치 북클럽';
}
render();
</script>
